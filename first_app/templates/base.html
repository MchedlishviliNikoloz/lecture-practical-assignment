
<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Company Management{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        nav {
            background: #202b3c;
            padding: 18px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            color: #61dafb;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        h1 {
            color: #202b3c;
        }

        .btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 9px 15px;
            border-radius: 5px;
            text-decoration: none;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 15px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat h2 {
            color: #2563eb;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'home' %}">მთავარი</a>
    <a href="{% url 'company_list' %}">კომპანიები</a>
    <a href="{% url 'department_list' %}">დეპარტამენტები</a>
    <a href="{% url 'employee_list' %}">თანამშრომლები</a>
    <a href="{% url 'position_list' %}">პოზიციები</a>
    <a href="{% url 'project_list' %}">პროექტები</a>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
